name: Release
# A published release: the single file is attached to it for download, and the site on GitHub Pages
# (the installable app, npm run pages) becomes that version. Pushes to main do not change the site.
on:
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pages # builds dist/index.html, then the site in dist/pages
      - name: Attach the single file to the release
        if: github.event_name == 'release'
        run: |
          file="LithicAnalyst-${TAG#v}.html"
          cp dist/index.html "$file"
          gh release upload "$TAG" "$file" --clobber
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
