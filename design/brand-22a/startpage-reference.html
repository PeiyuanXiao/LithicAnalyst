<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.st{--bg-top:#f0ebe0;--bg-bot:#dcd4c1;--ink:#1f1d19;--ink-2:#4f4a3f;--ink-3:#5f594c;--grid:rgba(80,96,108,.11);--ring:rgba(31,29,25,.08);--ring-2:rgba(31,29,25,.15);--card-top:#f8f4eb;--card-bot:#e9e2d2;--card-edge:rgba(31,29,25,.13);--card-hi:rgba(255,255,255,.85);--ghost:rgba(31,29,25,.055);--disc-c:#fffdf8;--disc-e:#e4dccb;--disc-ring:rgba(31,29,25,.12);--gap:#fdfaf3;--pict:#1f1d19;--dot:#e8a33a;--shadow:0 2px 4px rgba(60,50,30,.10),0 24px 46px -18px rgba(60,50,30,.38);--shadow-h:0 4px 10px rgba(60,50,30,.12),0 40px 64px -20px rgba(60,50,30,.5);--accent:#e8a33a;--accent-2:#d9792a;--on-accent:#1a1408;--hover-disc:#fbf1dc;--cloud:#1f1d19;--s1:#3f7f78;--s2:#e8a33a;--s3:#d4572a;--s4:#8f2d24;--btn-h:rgba(31,29,25,.07);--f-ui:"IBM Plex Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--f-display:"IBM Plex Sans Condensed","IBM Plex Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
.st.dark{--bg-top:#262928;--bg-bot:#121413;--ink:#e6e2d6;--ink-2:#b5b1a4;--ink-3:#9a9689;--grid:rgba(230,226,214,.05);--ring:rgba(230,226,214,.06);--ring-2:rgba(230,226,214,.12);--card-top:#2c302e;--card-bot:#1b1e1d;--card-edge:rgba(255,255,255,.07);--card-hi:rgba(255,255,255,.08);--ghost:rgba(230,226,214,.045);--disc-c:#3d4240;--disc-e:#1c1f1e;--disc-ring:rgba(230,226,214,.10);--gap:#363a38;--pict:#e6e2d6;--dot:#f2a33a;--shadow:0 2px 4px rgba(0,0,0,.45),0 26px 50px -18px rgba(0,0,0,.75);--shadow-h:0 4px 10px rgba(0,0,0,.5),0 42px 70px -20px rgba(0,0,0,.85);--accent:#f2a33a;--accent-2:#de7a2b;--cloud:#f2a33a;--btn-h:rgba(230,226,214,.08);color-scheme:dark}
.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;width:100%}
.card{position:relative;display:flex;flex:1;text-decoration:none;transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s,color .3s}
.card:hover,.card:focus-visible{transform:translateY(-8px);box-shadow:var(--shadow-h),inset 0 1px 0 var(--card-hi)!important;color:var(--on-accent)!important;--pict:#1f1d19;--gap:#fbf1dc;--disc-ring:rgba(26,20,8,.2);--dot:#1a1408}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.card .fill{opacity:0;transition:opacity .35s}
.card:hover .fill,.card:focus-visible .fill{opacity:1}
.card .ghost{transition:transform .8s cubic-bezier(.2,.7,.2,1),color .35s}
.card:hover .ghost,.card:focus-visible .ghost{transform:translateX(16px);color:rgba(26,20,8,.11)}
.card .hdisc{opacity:0;transition:opacity .35s}
.card:hover .hdisc,.card:focus-visible .hdisc{opacity:1}
.card .rings{transform-box:fill-box;transform-origin:50% 50%;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.card:hover .rings,.card:focus-visible .rings{transform:rotate(40deg) scale(1.05)}
.card .pict{transform-box:fill-box;transform-origin:50% 50%;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .pict,.card:focus-visible .pict{transform:scale(1.04)}
.card .pc{transition:fill-opacity .4s ease}
.card:hover .pc,.card:focus-visible .pc{fill-opacity:.14}
.card .ndl{transform-box:fill-box;transform-origin:0% 50%;transform:scaleX(0);transition:transform .25s ease}
.card:hover .ndl,.card:focus-visible .ndl{transform:none;transition:transform .42s cubic-bezier(.55,0,.15,1) calc(var(--d) + .08s)}
.card .ring{opacity:0;transform-box:fill-box;transform-origin:50% 50%;transform:scale(.3);transition:opacity .2s,transform .2s}
.card:hover .ring,.card:focus-visible .ring{opacity:1;transform:none;transition:opacity .2s var(--d),transform .3s cubic-bezier(.3,1.6,.5,1) var(--d)}
.card .solid{transition:opacity .35s}
.card:hover .solid,.card:focus-visible .solid{opacity:0}
.card .wire{opacity:0;transition:opacity .35s .1s}
.card:hover .wire,.card:focus-visible .wire{opacity:1}
.card .lmk{opacity:0;transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);transition:opacity .2s,transform .2s}
.card:hover .lmk,.card:focus-visible .lmk{opacity:1;transform:none;transition:opacity .2s var(--d),transform .35s cubic-bezier(.3,1.6,.5,1) var(--d)}
.mer,.mer2{transform-box:fill-box;transform-origin:50% 50%}
.card .enter{opacity:0;transform:translateX(-8px);transition:opacity .3s,transform .3s}
.card:hover .enter,.card:focus-visible .enter{opacity:1;transform:none}
.card .stripe{transition:height .25s}
.card:hover .stripe,.card:focus-visible .stripe{height:7px!important}
.ctl{height:32px;min-width:36px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--ink-3);font-family:var(--f-data);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ctl:hover{background:var(--btn-h);color:var(--ink)}
.ctl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:980px){.mods{grid-template-columns:repeat(1,minmax(0,1fr))!important}.wm{font-size:64px!important}.mark{width:112px!important;height:112px!important}}
@media (prefers-reduced-motion:no-preference){
.in{opacity:0;transform:translateY(28px);animation:in .85s cubic-bezier(.2,.8,.2,1) forwards}
.grow{transform:scaleX(0);transform-origin:left;animation:grow .45s cubic-bezier(.6,0,.2,1) forwards}
.wipe{clip-path:inset(0 100% 0 0);animation:wipe .9s cubic-bezier(.6,0,.2,1) forwards}
.pop{opacity:0;transform:scale(.6) rotate(-14deg);animation:pop .9s cubic-bezier(.2,.9,.25,1.15) forwards}
.bgin{opacity:0;animation:bgin 1.8s cubic-bezier(.2,.8,.2,1) forwards}
.fade{opacity:0;animation:fade .7s ease forwards}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 240s linear infinite}
.spin-r{transform-box:fill-box;transform-origin:50% 50%;animation:spin 320s linear infinite reverse}
.fx-c{opacity:0;transform:translateY(-12px);animation:fxin .75s cubic-bezier(.2,.8,.2,1) forwards}
.fx-l{opacity:0;transform:translate(-10px,-5px);animation:fxin .75s cubic-bezier(.2,.8,.2,1) forwards}
.fx-r{opacity:0;transform:translate(10px,-5px);animation:fxin .75s cubic-bezier(.2,.8,.2,1) forwards}
.fx-m{opacity:0;transform:translateY(-6px);animation:fxin .5s cubic-bezier(.2,.8,.2,1) forwards}
.fx-p{opacity:0;animation:fade .7s ease forwards}
.card:hover .mer,.card:focus-visible .mer{animation:mer 2.4s ease-in-out .4s infinite}
.card:hover .mer2,.card:focus-visible .mer2{animation:mer 2.4s ease-in-out 1.6s infinite}
}
@keyframes in{to{opacity:1;transform:none}}
@keyframes grow{to{transform:none}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes bgin{from{opacity:0;transform:translate(-50%,-50%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fxin{to{opacity:1;transform:none}}
@keyframes mer{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
@media (prefers-reduced-motion:reduce){.card .ndl,.card .ring,.card .lmk{transition:none!important}}
