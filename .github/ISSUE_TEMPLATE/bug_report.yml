name: Bug report
description: Something does not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a flake model (PLY, about 500,000 faces)
        2. …
  - type: input
    id: version
    attributes:
      label: Version
      description: In the Help dialog (the ? button), on the About page.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which copy
      options:
        - The single file (index.html)
        - The web site or the installed app
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Chrome 131, Windows 11
  - type: textarea
    id: files
    attributes:
      label: Model or project file
      description: Optional, and only if you are free to share it. The project file (.lithicanalyst.json) is often enough to reproduce a problem.
