name: Feature request
description: Suggest something new for LithicAnalyst, or a change to what it does.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The analysis or task, and what is missing or awkward now.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. A method, a measure or a reference (paper, software) if there is one.
  - type: dropdown
    id: specimen
    attributes:
      label: Specimen type
      multiple: true
      options:
        - Core
        - Flake
        - General
        - Any
  - type: input
    id: version
    attributes:
      label: Version
      description: In the Help dialog (the ? button), on the About page.
      placeholder: "1.0.0"
